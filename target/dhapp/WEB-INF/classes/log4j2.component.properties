# デプロイ単位の LoggerContext にする。
# EAP / WildFly ではサーバの log4j-api を使うと jboss-logmanager に吸い込まれ、
# この設定は読まれない。war 内の log4j-api を使う前提で、クラスローダごとにコンテキストを分ける。
log4j2.contextSelector=org.apache.logging.log4j.core.selector.ClassLoaderContextSelector

# Log4j 2.25 は設定 URL のプロトコルを file,https,jar だけに制限する。
# WildFly / JBoss EAP は war 内の log4j2-spring.xml を vfs: URL で渡す。
# vfs を許可しないと
#   ProtocolException: Protocol vfs has not been enabled as an allowed protocol
# で Spring のログ初期化が失敗し、デプロイできない。
log4j2.Configuration.allowedProtocols=file,https,jar,vfs
